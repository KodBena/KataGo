# Analysis-engine config for the persistence end-to-end witness
# (cpp/tests/e2e/persistence_e2e_witness.py). The witness substitutes its own temp directory
# for the @CACHE_DIR@ placeholder below, and "true" or "false" for @USE_EVAL_CACHE@ -- a
# PLACEHOLDER rather than a line the witness appends, because the engine refuses a config
# that states one key twice (loudly, by name: "was specified multiple times ... please delete
# one of them") and because a setting two legs disagree about should still have exactly one
# home in the file (ADR-0012 P1). An operator running this template by hand substitutes
# "false", which is af_e.cfg's own value.
#
# Derived from /home/bork/kg/audit-reports/impl-cache-actions.cfg, which is itself derived
# from the operator's /home/bork/kg/af_e.cfg. A config a witness runs under is part of the
# evidence (ADR-0015), so every difference from that parent is named here with its reason.
#
#   nnRandomize  true -> false     THE ONE CHANGE THIS WITNESS NEEDS. With randomization on,
#                                  the server thread picks a random input symmetry per
#                                  evaluation, so one net's evaluation of one position is not
#                                  reproducible across processes -- the numbers move even
#                                  though the cache key does not (the key is computed before
#                                  the symmetry is chosen, cpp/neuralnet/nneval.cpp).
#                                  This witness reads a net's returned rawWinrate/rawLead as
#                                  an IDENTITY FINGERPRINT -- "the number that came back is
#                                  14.gz's number and not 18.gz's" is the second, independent
#                                  observation under every cross-model leg -- and a
#                                  fingerprint that moves between runs is no fingerprint.
#                                  With it off, an entry re-served from disk comes back
#                                  BIT-IDENTICAL (the container stores the IEEE-754 pattern
#                                  verbatim) and a freshly computed one by the other net does
#                                  not.
#
#   numSearchThreads  2 -> 1       THE SECOND CHANGE THIS WITNESS NEEDS, and it is about the
#                                  word ZERO. MCTS with two search threads visits a
#                                  NONDETERMINISTIC SET of positions: which node a thread
#                                  expands depends on what the other has already claimed, and
#                                  a warm run -- whose lookups return instantly rather than
#                                  after ~2.4 ms -- races differently from a cold one.
#                                  Measured on this box at maxVisits=20 with two threads:
#                                  cold 21 rows, warm 1 row, because the warm search reached
#                                  one position the cold search never did. That is not the
#                                  cache failing; it is the two runs not asking the same
#                                  questions, and "ZERO evaluations on the re-served keys"
#                                  cannot be asserted against a moving key set. With one
#                                  search thread: cold 20 / warm 0 on three consecutive runs,
#                                  and both searches returned the identical winrate.
#
#   forDeterministicTesting  (new line, false -> true)
#                                  The engine's OWN knob (cpp/command/analysis.cpp), which
#                                  seeds the Rand that mints each bot's search seed from a
#                                  fixed string instead of from entropy. Without it every
#                                  process searches with a different seed, and a 20-visit
#                                  search over a near-tied pair of moves resolves the tie
#                                  differently from run to run. Measured: 18.gz's searched
#                                  winrate for this position flipped between 0.569245778 and
#                                  0.577066969 across five runs while its ROOT NEURAL NET
#                                  EVALUATION (rawWinrate 0.493979156) never moved once --
#                                  the search was moving, not the net. Leg K5 compares whole
#                                  search shapes and cannot do that against a moving search.
#
# Everything else is impl-cache-actions.cfg's, unchanged, including:
#   numAnalysisThreads = 1         one analysis lane, so a leg's phases do not interleave.
#   nnCacheSizePowerOfTwo = 16     ~195 MB per evaluator at the measured ~2,972 B/entry, and
#                                  this witness hosts TWO nets on a 9 GB box. af_e.cfg's 2^21
#                                  would be ~6.2 GB per evaluator if it ever filled.
#   useEvalCache                   substituted per leg; see the @USE_EVAL_CACHE@ note above.
#
#   evalCacheMinVisits  (new line, 100 -> 1)
#                                  Not in the parent config at all; the engine's own default
#                                  is 100. It decides how many visits a node needs before its
#                                  search result enters the eval cache, so at this witness's
#                                  maxVisits of 20 the default leaves the eval cache PERMANENTLY
#                                  EMPTY -- and a leg asserting that one model is not served
#                                  another's cached search result, against a cache holding
#                                  nothing, asserts nothing. That is not a supposition: the
#                                  witness's first draft of leg K5 was written against the
#                                  default, and a seen-red pass that deleted the model salt
#                                  outright could not make it go red. At 1 the root of a
#                                  20-visit search is cached and the leg observes something.
#                                  Irrelevant wherever useEvalCache is false, which is every
#                                  leg but K5 and K6.
#   nnCacheDir                     the whole point: without it the cache actions are refused.

forDeterministicTesting = true
logSearchInfo = false
logToStderr = true
logAllRequests = false
reportAnalysisWinratesAs = WHITE
conservativePass = true
maxVisits = 500
numAnalysisThreads = 1
numSearchThreads = 1
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 10
nnRandomize = false
useEvalCache = @USE_EVAL_CACHE@
evalCacheMinVisits = 1
nnCacheDir = @CACHE_DIR@
